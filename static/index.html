<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>审计知识 RAG 问答系统</title>
  <style>
    body {
      margin: 0;
      font-family: "Microsoft YaHei", Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    .container {
      max-width: 960px;
      margin: 40px auto;
      background: #fff;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
      color: #1f3a5f;
      text-align: center;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 32px;
    }

    textarea {
      width: 100%;
      height: 120px;
      padding: 14px;
      font-size: 16px;
      border: 1px solid #d0d7de;
      border-radius: 10px;
      resize: vertical;
      box-sizing: border-box;
      outline: none;
    }

    textarea:focus {
      border-color: #2f6fed;
      box-shadow: 0 0 0 3px rgba(47, 111, 237, 0.12);
    }

    button {
      margin-top: 16px;
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      background: #2f6fed;
      color: #fff;
      cursor: pointer;
      font-weight: 600;
    }

    button:disabled {
      background: #9bb8f0;
      cursor: not-allowed;
    }

    .section {
      margin-top: 28px;
    }

    .answer-box {
      white-space: pre-wrap;
      line-height: 1.8;
      background: #f8fafc;
      padding: 20px;
      border-radius: 12px;
      border-left: 5px solid #2f6fed;
    }

    .sources {
      margin-top: 16px;
    }

    .source-card {
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 12px;
    }

    .source-title {
      font-weight: 600;
      color: #1f3a5f;
    }

    .source-meta {
      font-size: 14px;
      color: #666;
      margin-top: 6px;
    }

    .source-link {
      margin-top: 8px;
      display: inline-block;
      color: #2f6fed;
      text-decoration: none;
      word-break: break-all;
    }

    .source-link:hover {
      text-decoration: underline;
    }

    .loading {
      color: #666;
      margin-top: 16px;
      display: none;
    }

    .error {
      color: #b42318;
      background: #fff1f0;
      padding: 12px;
      border-radius: 8px;
      margin-top: 16px;
      display: none;
    }

    .examples {
      margin-top: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .example {
      padding: 8px 12px;
      background: #eef4ff;
      color: #1f3a5f;
      border-radius: 999px;
      font-size: 14px;
      cursor: pointer;
    }

    .example:hover {
      background: #dceaff;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>审计知识 RAG 问答系统</h1>
    <div class="subtitle">
      基于审计署公开审计知识问答、本地向量库与大模型生成的审计知识助手
    </div>

    <textarea id="question" placeholder="请输入你的审计问题，例如：经济责任审计的对象有哪些？"></textarea>

    <div class="examples">
      <div class="example" onclick="fillExample('经济责任审计的对象有哪些？')">经济责任审计的对象有哪些？</div>
      <div class="example" onclick="fillExample('什么是内部审计？')">什么是内部审计？</div>
      <div class="example" onclick="fillExample('审计机关如何开展对内部审计工作的监督？')">内部审计监督怎么开展？</div>
      <div class="example" onclick="fillExample('审计项目审计组织方式“两统筹”是什么？')">什么是“两统筹”？</div>
    </div>

    <button id="submitBtn" onclick="askQuestion()">提交问题</button>

    <div id="loading" class="loading">正在检索审计知识库并生成答案，请稍候...</div>
    <div id="error" class="error"></div>

    <div id="result" style="display: none;">
      <div class="section">
        <h2>回答</h2>
        <div id="answer" class="answer-box"></div>
      </div>

      <div class="section">
        <h2>参考来源</h2>
        <div id="sources" class="sources"></div>
      </div>
    </div>
  </div>

  <script>
    function fillExample(text) {
      document.getElementById("question").value = text;
    }

    async function askQuestion() {
      const question = document.getElementById("question").value.trim();
      const submitBtn = document.getElementById("submitBtn");
      const loading = document.getElementById("loading");
      const error = document.getElementById("error");
      const result = document.getElementById("result");
      const answerBox = document.getElementById("answer");
      const sourcesBox = document.getElementById("sources");

      if (!question) {
        error.style.display = "block";
        error.textContent = "请输入问题。";
        return;
      }

      submitBtn.disabled = true;
      loading.style.display = "block";
      error.style.display = "none";
      result.style.display = "none";
      answerBox.textContent = "";
      sourcesBox.innerHTML = "";

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ question }),
        });

        if (!response.ok) {
          throw new Error("请求失败，状态码：" + response.status);
        }

        const data = await response.json();

        answerBox.textContent = data.answer || "未生成答案。";

        if (data.sources && data.sources.length > 0) {
          data.sources.forEach((src, index) => {
            const card = document.createElement("div");
            card.className = "source-card";

            card.innerHTML = `
              <div class="source-title">${index + 1}. ${src.title || "无标题"}</div>
              <div class="source-meta">发布日期：${src.publish_date || "未知"} ｜ 来源：${src.source || "未知"} ｜ 匹配分数：${src.score ? src.score.toFixed(4) : "未知"}</div>
              <a class="source-link" href="${src.url}" target="_blank">${src.url}</a>
            `;

            sourcesBox.appendChild(card);
          });
        } else {
          sourcesBox.textContent = "暂无参考来源。";
        }

        result.style.display = "block";
      } catch (err) {
        error.style.display = "block";
        error.textContent = "系统错误：" + err.message;
      } finally {
        submitBtn.disabled = false;
        loading.style.display = "none";
      }
    }
  </script>
</body>
</html>
